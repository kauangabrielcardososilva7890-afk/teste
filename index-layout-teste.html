 const nav=(id,icon,label)=>`<button data-proto-nav="${id}" class="w-full h-10 px-3 rounded-xl flex items-center gap-3 text-[13.5px] font-medium text-white/60 hover:text-white"><i class="ph ${icon} text-[19px]"></i><span>${label}</span></button>`;
 const main=document.getElementById('nav-main'),op=document.getElementById('nav-op'),gest=document.getElementById('nav-gest');

 if(main)main.innerHTML=nav('dashboard','ph-house','Início')+nav('vendas','ph-shopping-cart-simple','Vender / Orçar')+nav('clientes','ph-users','Clientes')+nav('produtos','ph-package','Estoque');
 if(op)op.innerHTML=nav('impressoras','ph-printer','Cadastro de impressoras')+nav('contratos','ph-file-text','Contratos de locação')+nav('parque','ph-map-pin','Máquinas nos clientes')+nav('leituras','ph-speedometer','Leituras')+nav('manutencao','ph-wrench','Chamados');
 if(gest)gest.innerHTML=nav('financeiro','ph-bank','Financeiro')+nav('relatorios','ph-chart-bar','Relatórios')+nav('usuarios','ph-users-three','Usuários')+nav('auditoria','ph-clipboard-text','Auditoria')+nav('config','ph-gear','Configurações');
 const d=document.getElementById('view-dashboard'); if(d)d.innerHTML=`<div class="neo-shell"><div class="flex items-end justify-between gap-4 mb-6"><div><p class="text-[11px] uppercase tracking-widest font-bold text-[#0a1e8a]">Prévia do layout</p><h1 class="text-[28px] font-bold tracking-tight text-slate-800 mt-2">Início</h1><p class="text-[13px] text-slate-500 mt-1">Área principal vazia para testar a navegação do sistema.</p></div><span class="simple-pill px-3 py-2 rounded-lg text-[11px] font-semibold">Protótipo virgem</span></div><div class="proto-empty"><i class="ph ph-layout"></i><b>Nenhum dado carregado</b><p>Esta cópia contém somente o layout original e os menus.<br>Use a barra superior e o menu lateral para avaliar a organização.</p></div></div>`;

Object.keys(telas).forEach(montarLista);
window.navigateTo=function(id){const aliases={'Nova venda':'vendas','Orçamentos':'vendas','Novo cliente':'clientes','Nova leitura':'leituras','Novo chamado':'manutencao','Contas a receber':'financeiro','Contas a pagar':'financeiro','Fluxo de caixa':'financeiro','Nuvem':'config','Pesquisar':'clientes','Ajuda':'config'};id=aliases[id]||id;document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));const v=document.getElementById('view-'+id);if(v)v.classList.remove('hidden');const names={dashboard:'Início',...Object.fromEntries(Object.entries(telas).map(([k,v])=>[k,v[0]]))};const t=names[id]||id;const h=document.getElementById('page-title');if(h)h.textContent=t;document.querySelectorAll('[data-proto-nav]').forEach(x=>x.classList.toggle('bg-white/[0.12]',x.dataset.protoNav===id));};

 window.toast=function(){ };window.openQuickOS=window.openModal=window.closeModal=window.exportBackup=window.doLogout=window.abrirCloudflareNuvem=function(){};window.ntfAlternarPainel=function(){};
 document.querySelectorAll('[data-proto-nav]').forEach(b=>b.addEventListener('click',()=>navigateTo(b.dataset.protoNav)));
 navigateTo('dashboard');
})();
