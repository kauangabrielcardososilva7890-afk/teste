<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIGICOPY — Teste de Upload (raio-X)</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#0a1e8a;color:#fff;margin:0;padding:24px;min-height:100vh;box-sizing:border-box}
  h1{font-size:22px;margin:0 0 4px} p.sub{opacity:.8;margin:0 0 20px;font-size:14px}
  .card{background:#fff;color:#111827;border-radius:14px;padding:20px;max-width:760px;margin:0 auto}
  input[type=file]{display:block;width:100%;font-size:16px;padding:14px;border:2px dashed #0a1e8a;border-radius:10px;background:#f0f4ff;cursor:pointer;box-sizing:border-box}
  #log{background:#111827;color:#d1fae5;font-family:Consolas,monospace;font-size:13px;border-radius:10px;padding:14px;margin-top:16px;white-space:pre-wrap;min-height:120px;max-height:420px;overflow-y:auto}
  .erro{color:#fca5a5;font-weight:bold}.ok{color:#6ee7b7}.info{color:#93c5fd}
  button{margin-top:12px;background:#0a1e8a;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="card">
  <h1>🩻 Raio-X do Upload <span style="font-size:12px;color:#6b7280">build 3.11.2</span></h1>
  <p class="sub" style="color:#6b7280">Teste isolado do ERP. Selecione 1 ou mais arquivos .JSON da pasta <b>C:\Temp\export</b> e veja as linhas aparecerem abaixo. Depois mande PRINT desta tela inteira.</p>
  <input type="file" id="arq" accept=".json,application/json" multiple>
  <button id="btnTeste">🔘 Testar sem arquivo (só prova que o clique funciona)</button>
  <div id="log"></div>
</div>
<script>
(function(){
  var logEl = document.getElementById('log');
  function log(txt, cls){
    var linha = document.createElement('div');
    if(cls) linha.className = cls;
    var agora = new Date();
    var hh = String(agora.getHours()).padStart(2,'0')+':'+String(agora.getMinutes()).padStart(2,'0')+':'+String(agora.getSeconds()).padStart(2,'0');
    linha.textContent = '['+hh+'] '+txt;
    logEl.appendChild(linha);
    logEl.scrollTop = logEl.scrollHeight;
  }
  window.onerror = function(msg, src, lin, col){
    log('❌ ERRO NÃO TRATADO: '+msg+' (linha '+lin+')', 'erro');
  };

  log('✅ 1/6 — Página carregou e o JavaScript está funcionando', 'ok');

  document.getElementById('btnTeste').addEventListener('click', function(){
    log('✅ Clique no botão funcionou! (eventos OK)', 'ok');
  });

  var inp = document.getElementById('arq');
  inp.addEventListener('click', function(){
    log('ℹ️  Você clicou em "Escolher arquivo"...', 'info');
  });

  inp.addEventListener('change', function(){
    var files = inp.files;
    log('✅ 2/6 — Evento de SELEÇÃO disparou! Arquivos escolhidos: '+(files ? files.length : 0), 'ok');
    if(!files || !files.length){ log('⚠️ Nenhum arquivo na seleção.', 'erro'); return; }

    var lidos = 0;
    for(var i=0;i<files.length;i++){
      (function(f, idx){
        log('   📄 '+(idx+1)+'/'+files.length+': '+f.name+' ('+Math.round(f.size/1024)+' KB)');
        f.text().then(function(txt){
          log('✅ 3/6 — Leitura do conteúdo de '+f.name+' OK ('+Math.round(txt.length/1024)+' KB de texto)', 'ok');
          try {
            var j = JSON.parse(txt);
            var n = Array.isArray(j) ? j.length : 'objeto';
            log('✅ 4/6 — '+f.name+' é JSON válido ('+(Array.isArray(j)?(n+' registros'):'formato objeto')+')', 'ok');
          } catch(e){
            log('⚠️ '+f.name+' NÃO é JSON válido: '+e.message, 'erro');
          }
          lidos++;
          if(lidos===files.length){
            log('🏁 5/6 — Todos os arquivos lidos! O mecanismo de upload está 100% OK nesta página.', 'ok');
            log('👉 Mande PRINT desta tela pro suporte (Kauan/Arena).', 'info');
          }
        }).catch(function(e){
          log('❌ Falha ao ler '+f.name+': '+e.message, 'erro');
        });
      })(files[i], i);
    }
  });

  log('ℹ️  6/6 — Aguardando você escolher os arquivos acima ↑', 'info');
})();
</script>
</body>
</html>
