<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscador Escola - Configurar Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f0f2f5;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.1);padding:40px;width:100%;max-width:420px}
h1{font-size:20px;color:#0a1e8a;margin-bottom:8px}
p{font-size:13px;color:#666;margin-bottom:24px}
label{display:block;font-size:11px;font-weight:bold;text-transform:uppercase;color:#555;margin-bottom:4px}
input{width:100%;height:44px;border:1px solid #ddd;border-radius:10px;padding:0 12px;font-size:14px;margin-bottom:16px}
input:focus{outline:none;border-color:#0a1e8a;box-shadow:0 0 0 3px rgba(10,30,138,.1)}
button{width:100%;height:48px;background:#0a1e8a;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:bold;cursor:pointer;margin-top:8px}
button:hover{background:#08176e}
button:disabled{background:#94a3b8;cursor:not-allowed}
.status{margin-top:16px;padding:12px;border-radius:10px;font-size:13px;display:none}
.status.ok{display:block;background:#dcfce7;color:#166534;border:1px solid #86efac}
.status.err{display:block;background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.status.info{display:block;background:#dbeafe;color:#1e40af;border:1px solid #93c5fd}
</style>
</head>
<body>
<div class="card">
  <h1>🔐 Buscador Escola</h1>
  <p>Configure o login da API do Caixa Escolar MG. As credenciais são salvas na nuvem.</p>
  
  <label>Usuário / CNPJ</label>
  <input type="text" id="usuario" placeholder="Seu CNPJ ou usuário da API">
  
  <label>Senha</label>
  <input type="password" id="senha" placeholder="Senha da API">
  
  <button id="btnSalvar" onclick="salvar()">Salvar e enviar para nuvem</button>
  <button onclick="carregar()" style="background:#fff;color:#0a1e8a;border:2px solid #0a1e8a">Carregar da nuvem</button>
  
  <div id="status" class="status"></div>
</div>

<script>
const API_KEY = 'AIzaSyAEsHFZWRNiwMypSRU1azBj66p8g0FTi8U';
const PROJECT = 'digicopy-sistema-nuvem';
const RES_BASE = 'projects/' + PROJECT + '/databases/(default)/documents';
const BASE = 'https://firestore.googleapis.com/v1/' + RES_BASE;
const AUTH_KEY = 'digicopy_firebase_auth_v1';
const DOC_KEY = 'buscador_credenciais';

function show(msg, type) {
  const el = document.getElementById('status');
  el.className = 'status ' + type;
  el.textContent = msg;
}

// Autenticação anônima (igual ao sistema principal)
async function getToken() {
  let salvo = null;
  try { salvo = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch(e) {}
  if (salvo && salvo.idToken && salvo.expira > Date.now() + 60000) return salvo.idToken;
  if (salvo && salvo.refreshToken) {
    try {
      const r = await fetch('https://securetoken.googleapis.com/v1/token?key=' + API_KEY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(salvo.refreshToken)
      });
      const j = await r.json();
      if (r.ok && j.id_token) {
        const a = { idToken: j.id_token, refreshToken: j.refresh_token || salvo.refreshToken, expira: Date.now() + (parseInt(j.expires_in) || 3600) * 1000 };
        localStorage.setItem(AUTH_KEY, JSON.stringify(a));
        return a.idToken;
      }
    } catch(e) {}
  }
  // Cria sessão anônima nova
  try {
    const r2 = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + API_KEY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ returnSecureToken: true })
    });
    const j2 = await r2.json();
    if (r2.ok && j2.idToken) {
      const a = { idToken: j2.idToken, refreshToken: j2.refreshToken || '', expira: Date.now() + (parseInt(j2.expiresIn) || 3600) * 1000 };
      localStorage.setItem(AUTH_KEY, JSON.stringify(a));
      return a.idToken;
    }
  } catch(e) {}
  return null;
}

async function fireFetch(url, method, body) {
  const token = await getToken();
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const opts = { method, headers };
  if (body) opts.body = JSON.stringify(body);
  const sep = url.indexOf('?') < 0 ? '?' : '&';
  const r = await fetch(url + sep + 'key=' + API_KEY, opts);
  const text = await r.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch(e) { data = text; }
  if (!r.ok) throw new Error(data?.error?.message || 'HTTP ' + r.status);
  return data;
}

function toFields(obj) {
  const fields = {};
  for (const [k, v] of Object.entries(obj)) {
    if (typeof v === 'string') fields[k] = { stringValue: v };
    else if (typeof v === 'number') fields[k] = { integerValue: String(v) };
  }
  return { fields };
}

function fromFields(doc) {
  const f = doc.fields || {};
  const out = {};
  for (const [k, v] of Object.entries(f)) {
    if (v.stringValue !== undefined) out[k] = v.stringValue;
    else if (v.integerValue !== undefined) out[k] = parseInt(v.integerValue);
  }
  return out;
}

async function salvar() {
  const usuario = document.getElementById('usuario').value.trim();
  const senha = document.getElementById('senha').value.trim();
  if (!usuario || !senha) { show('Preencha usuário e senha', 'err'); return; }
  
  const btn = document.getElementById('btnSalvar');
  btn.disabled = true;
  try {
    show('Autenticando e salvando...', 'info');
    const data = toFields({ usuario, senha, atualizadoEm: new Date().toISOString() });
    await fireFetch(BASE + '/' + DOC_KEY, 'PATCH', data);
    show('✅ Credenciais salvas na nuvem! Usuário: ' + usuario, 'ok');
  } catch (e) {
    show('Erro: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

async function carregar() {
  try {
    show('Carregando da nuvem...', 'info');
    const doc = await fireFetch(BASE + '/' + DOC_KEY, 'GET');
    const data = fromFields(doc);
    if (data.usuario) {
      document.getElementById('usuario').value = data.usuario || '';
      document.getElementById('senha').value = data.senha || '';
      show('✅ Carregado! Usuário: ' + data.usuario + ' (atualizado: ' + (data.atualizadoEm || '-') + ')', 'ok');
    } else {
      show('Nenhuma credencial encontrada na nuvem', 'err');
    }
  } catch (e) {
    show('Erro ao carregar: ' + e.message, 'err');
  }
}

window.onload = function() { setTimeout(carregar, 500); };
</script>
</body>
</html>
