<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscador Escola - Configurar Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f0f2f5;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.wrap{display:flex;gap:16px;width:100%;max-width:700px}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.1);padding:32px;flex:1}
h1{font-size:18px;color:#0a1e8a;margin-bottom:6px}
p{font-size:12px;color:#666;margin-bottom:20px}
label{display:block;font-size:11px;font-weight:bold;text-transform:uppercase;color:#555;margin-bottom:4px}
input{width:100%;height:42px;border:1px solid #ddd;border-radius:10px;padding:0 12px;font-size:14px;margin-bottom:14px}
input:focus{outline:none;border-color:#0a1e8a;box-shadow:0 0 0 3px rgba(10,30,138,.1)}
button{width:100%;height:46px;background:#0a1e8a;color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:bold;cursor:pointer}
button:hover{background:#08176e}
button:disabled{background:#94a3b8;cursor:not-allowed}
.status{margin-top:14px;padding:10px;border-radius:10px;font-size:12px;display:none}
.status.ok{display:block;background:#dcfce7;color:#166534;border:1px solid #86efac}
.status.err{display:block;background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.status.info{display:block;background:#dbeafe;color:#1e40af;border:1px solid #93c5fd}
.result{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:16px;min-height:60px}
.result h3{font-size:13px;color:#0a1e8a;margin-bottom:10px}
.result .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:12px}
.result .row:last-child{border:none}
.result .lbl{color:#64748b;font-weight:bold}
.result .val{color:#1e293b;font-weight:bold}
.empty{color:#94a3b8;font-size:12px;text-align:center;padding:20px}
</style>
</head>
<body>
<div class="wrap">
  <!-- ESQUERDA: INPUT -->
  <div class="card">
    <h1>🔐 Login API</h1>
    <p>Configure o CNPJ e senha da API do Caixa Escolar MG.</p>
    
    <label>CNPJ / Usuário</label>
    <input type="text" id="usuario" placeholder="08.385.589/0001-03">
    
    <label>Senha</label>
    <input type="password" id="senha" placeholder="Senha da API">
    
    <button id="btnSalvar" onclick="salvar()">Salvar na nuvem</button>
    
    <div id="status" class="status"></div>
  </div>
  
  <!-- DIREITA: RESULTADO (somente leitura) -->
  <div class="card">
    <h1>☁️ Salvo na nuvem</h1>
    <p>Dados atualmente salvos no Firebase.</p>
    
    <div id="resultado" class="result">
      <p class="empty">Clique em "Salvar na nuvem" para ver o resultado aqui.</p>
    </div>
  </div>
</div>

<script>
const API_KEY = 'AIzaSyAEsHFZWRNiwMypSRU1azBj66p8g0FTi8U';
const PROJECT = 'digicopy-sistema-nuvem';
const BASE = 'https://firestore.googleapis.com/v1/projects/' + PROJECT + '/databases/(default)/documents';
const AUTH_KEY = 'digicopy_firebase_auth_v1';
const COLL = 'app_state';
const DOC_ID = 'buscador_credenciais';

function show(msg, type) {
  const el = document.getElementById('status');
  el.className = 'status ' + type;
  el.textContent = msg;
}

function mostrarResultado(data) {
  const el = document.getElementById('resultado');
  if (!data || !data.usuario) {
    el.innerHTML = '<p class="empty">Nenhum dado salvo ainda.</p>';
    return;
  }
  el.innerHTML = '<h3>✅ Dados salvos</h3>'
    + '<div class="row"><span class="lbl">CNPJ/Usuário</span><span class="val">' + esc(data.usuario) + '</span></div>'
    + '<div class="row"><span class="lbl">Senha</span><span class="val">' + esc(data.senha) + '</span></div>'
    + '<div class="row"><span class="lbl">Atualizado em</span><span class="val">' + esc(data.atualizadoEm || '-') + '</span></div>';
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function getToken() {
  let salvo = null;
  try { salvo = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch(e) {}
  if (salvo && salvo.idToken && salvo.expira > Date.now() + 60000) return salvo.idToken;
  if (salvo && salvo.refreshToken) {
    try {
      const r = await fetch('https://securetoken.googleapis.com/v1/token?key=' + API_KEY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(salvo.refreshToken)
      });
      const j = await r.json();
      if (r.ok && j.id_token) {
        const a = { idToken: j.id_token, refreshToken: j.refresh_token || salvo.refreshToken, expira: Date.now() + (parseInt(j.expires_in) || 3600) * 1000 };
        localStorage.setItem(AUTH_KEY, JSON.stringify(a));
        return a.idToken;
      }
    } catch(e) {}
  }
  try {
    const r2 = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + API_KEY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ returnSecureToken: true })
    });
    const j2 = await r2.json();
    if (r2.ok && j2.idToken) {
      const a = { idToken: j2.idToken, refreshToken: j2.refreshToken || '', expira: Date.now() + (parseInt(j2.expiresIn) || 3600) * 1000 };
      localStorage.setItem(AUTH_KEY, JSON.stringify(a));
      return a.idToken;
    }
  } catch(e) {}
  return null;
}

async function fireFetch(url, method, body) {
  const token = await getToken();
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const opts = { method, headers };
  if (body) opts.body = JSON.stringify(body);
  const sep = url.indexOf('?') < 0 ? '?' : '&';
  const r = await fetch(url + sep + 'key=' + API_KEY, opts);
  const text = await r.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch(e) { data = text; }
  if (!r.ok) throw new Error(data?.error?.message || 'HTTP ' + r.status);
  return data;
}

function toFields(obj) {
  const fields = {};
  for (const [k, v] of Object.entries(obj)) {
    if (typeof v === 'string') fields[k] = { stringValue: v };
    else if (typeof v === 'number') fields[k] = { integerValue: String(v) };
  }
  return { fields };
}

function fromFields(doc) {
  const f = doc.fields || {};
  const out = {};
  for (const [k, v] of Object.entries(f)) {
    if (v.stringValue !== undefined) out[k] = v.stringValue;
    else if (v.integerValue !== undefined) out[k] = parseInt(v.integerValue);
  }
  return out;
}

async function salvar() {
  const usuario = document.getElementById('usuario').value.trim();
  const senha = document.getElementById('senha').value.trim();
  if (!usuario || !senha) { show('Preencha CNPJ e senha', 'err'); return; }
  
  const btn = document.getElementById('btnSalvar');
  btn.disabled = true;
  try {
    show('Salvando na nuvem...', 'info');
    const data = toFields({ usuario, senha, atualizadoEm: new Date().toISOString() });
    await fireFetch(BASE + '/' + COLL + '/' + DOC_ID, 'PATCH', data);
    const resultado = { usuario, senha, atualizadoEm: new Date().toLocaleString('pt-BR') };
    mostrarResultado(resultado);
    show('✅ Salvo com sucesso!', 'ok');
  } catch (e) {
    show('Erro: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

// Carrega automaticamente ao abrir
window.onload = async function() {
  try {
    const doc = await fireFetch(BASE + '/' + COLL + '/' + DOC_ID, 'GET');
    const data = fromFields(doc);
    if (data.usuario) {
      mostrarResultado(data);
    }
  } catch(e) {}
};
</script>
</body>
</html>
