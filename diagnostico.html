<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIGICOPY — Diagnóstico de sincronização</title>
<link rel="icon" href="./logo.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
  body{background:#f3f4f6;color:#111827}
  .wrap{max-width:860px;margin:24px auto;padding:0 16px}
  .head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .head img{height:40px}
  .head h1{font-size:20px;font-weight:800}
  .head p{font-size:12px;color:#64748b}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .card h2{font-size:14px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .ok{color:#047857;font-weight:700}.bad{color:#b91c1c;font-weight:700}.warn{color:#b45309;font-weight:700}.dim{color:#64748b}
  pre{background:#0f172a;color:#a5f3fc;font-size:11.5px;padding:12px;border-radius:10px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin-top:8px;max-height:300px}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
  td,th{border:1px solid #e5e7eb;padding:5px 8px;text-align:left}
  th{background:#f8fafc;font-size:11px;text-transform:uppercase;color:#64748b}
  .btn{display:inline-block;background:#0a1e8a;color:#fff;border:0;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;margin-right:6px}
  .btn.gray{background:#475569}
  .mono{font-family:Consolas,monospace;font-size:11.5px}
  .big{font-size:15px;padding:8px 10px;border-radius:8px;margin-top:6px;display:block}
  .b-ok{background:#dcfce7}.b-bad{background:#fee2e2}.b-warn{background:#fef3c7}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <img src="./logo.png" alt="DIGICOPY">
    <div><h1>Diagnóstico — Sincronização DIGICOPY</h1><p>build diag 1.3 • envie um print desta tela inteira</p></div>
  </div>

  <div class="card">
    <h2>1. Ambiente</h2>
    <div id="env">...</div>
  </div>

  <div class="card">
    <h2>2. Dados no NAVEGADOR (localStorage deste domínio)</h2>
    <div id="local">...</div>
  </div>

  <div class="card">
    <h2>3. Dados na NUVEM (Supabase app_state)</h2>
    <div id="cloud">Testando conexão...</div>
  </div>

  <div class="card">
    <h2>4. Conclusão automática</h2>
    <div id="verdict">Aguarde...</div>
  </div>

  <div style="margin:14px 0 30px">
    <a class="btn" href="./index.html">← Abrir o ERP</a>
    <button class="btn gray" onclick="location.reload()">Atualizar diagnóstico</button>
  </div>
</div>

<script src="./lz.js"></script>
<script>
const SUPA_URL = 'https://abfzubhivcarwiynuvhz.supabase.co/rest/v1';
const SUPA_KEY = 'sb_publishable_O91tDfAY_vrtp8feezXXkA_aNhpCjJH';
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function supa(path){
  const r = await fetch(SUPA_URL + '/' + path, {headers:{apikey:SUPA_KEY, Authorization:'Bearer '+SUPA_KEY}});
  const t = await r.text();
  let d; try{ d = JSON.parse(t); }catch{ d = t; }
  if(!r.ok) throw new Error((d && (d.message||d.error)) || t || ('HTTP '+r.status));
  return d;
}

(async function(){
  const out = { origem: location.origin, navegador: navigator.userAgent.split(') ')[0]+')', versaoPagina: 'diag 1.0' };
  $('env').innerHTML = `<table><tr><th>Origem desta página</th><th>Navegador</th></tr><tr><td class="mono">${esc(out.origem)}</td><td class="mono">${esc(out.navegador)}</td></tr></table>
    <p class="dim" style="margin-top:6px">Dica: o ERP precisa estar na build <b>3.10.1</b> (aparece no console F12 ao abrir o index.html).</p>`;

  // ── LOCAL ──
  let localModulos = 0, localModulosDetalhe = [], localVazio = true, localResumo = '';
  try{
    const raw = localStorage.getItem('digicopy_erp_v30');
    if(!raw){
      $('local').innerHTML = '<span class="bad big b-bad">NENHUM dado local neste domínio (localStorage vazio). Este navegador ainda não importou nem carregou da nuvem.</span>';
    } else {
      localVazio = false;
      const db = JSON.parse((raw.startsWith('LZ1:') && window.LZUTF16) ? (window.LZUTF16.decompress(raw.slice(4))||'{}') : raw);
      const cont = k => Array.isArray(db[k]) ? db[k].length : (db[k] && typeof db[k]==='object' ? Object.keys(db[k]).length : 0);
      const mods = db.modulosDinamicos || {};
      localModulosDetalhe = Object.entries(mods).map(([k,v]) => k + ' (' + ((v&&v.dados&&v.dados.length)||0) + ')');
      localModulos = localModulosDetalhe.length;
      localResumo = `<table><tr><th>clientes</th><th>produtos</th><th>equipamentos</th><th>vendas</th><th>contasRec</th><th>modulosDinamicos</th></tr>
        <tr><td>${cont('clientes')}</td><td>${cont('produtos')}</td><td>${cont('equipamentos')}</td><td>${cont('vendas')}</td><td>${cont('contasReceber')}</td><td><b>${localModulos}</b></td></tr></table>`;
      $('local').innerHTML = localResumo + (localModulos
        ? `<p class="ok big b-ok">✅ Há ${localModulos} módulo(s) migrado(s) neste navegador → o menu 🧩 Migrados DEVE aparecer na build 3.9.5+: <span class="mono">${esc(localModulosDetalhe.join(', ')).slice(0,400)}</span></p>`
        : '<p class="warn big b-warn">⚠️ modulosDinamicos VAZIO neste navegador → por isso o menu Migrados não aparece.</p>');
    }
  }catch(e){
    $('local').innerHTML = '<span class="bad big b-bad">Erro lendo localStorage: '+esc(e.message)+'</span>';
  }

  // ── NUVEM ──
  let cloudOk=false, cloudMeta=null, cloudPartes=0, cloudModulosTotal=0, cloudLegacy=false, cloudErr='', cloudLacunas=[];
  try{
    const metaRows = await supa('app_state?select=data,updated_at&key=eq.digicopy_erp_v2_meta&limit=1');
    const partes = await supa('app_state?select=key&key=like.digicopy_erp_v2__*&limit=1000');
    const legacy = await supa('app_state?select=key,updated_at&key=eq.digicopy_erp_state_v1&limit=1');
    cloudPartes = (partes||[]).length;
    cloudLegacy = !!(legacy && legacy.length);
    if(metaRows && metaRows.length){
      cloudOk = true;
      cloudMeta = metaRows[0].data || {};
      const md = (cloudMeta.entidades||{}).modulosDinamicos;
      cloudModulosTotal = md ? (md.total||0) : 0;
    }
    // Analisa lacunas nas partes (ex.: p0..p27 faltando p7, p20)
    const grupos={};
    (partes||[]).forEach(r=>{
      const mm=(r.key||'').replace('digicopy_erp_v2__','').match(/^(.*)__p(\d+)$/);
      if(!mm) return;
      const c=mm[1], i=+mm[2];
      if(!grupos[c]) grupos[c]={max:-1, tem:{}};
      grupos[c].max=Math.max(grupos[c].max,i); grupos[c].tem[i]=1;
    });
    const lacunas=[];
    Object.entries(grupos).forEach(([c,g])=>{ const falta=[]; for(let i=0;i<=g.max;i++) if(!g.tem[i]) falta.push('p'+i); if(falta.length) lacunas.push(`<b>${esc(c)}</b>: faltam ${falta.join(', ')}`); });
    cloudLacunas = lacunas;
    const lacunasHtml = lacunas.length
      ? `<p class="warn b-warn" style="margin-top:6px">⚠️ Envio anterior ficou INCOMPLETO — ${lacunas.join(' • ')}.<br><span class="dim">O ERP (build 3.9.7+) recupera o que existe no "Carregar da nuvem", e o "Enviar para nuvem" refeito no PC da importação completa 100%.</span></p>`
      : (cloudPartes ? '<p class="ok" style="margin-top:6px">Nenhuma lacuna nas partes gravadas.</p>' : '');
    const ent = cloudMeta ? Object.entries(cloudMeta.entidades||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.partes}</td><td>${(v.total||0).toLocaleString('pt-BR')}</td></tr>`).join('') : '';
    $('cloud').innerHTML = (cloudOk
      ? `<p class="ok big b-ok">✅ Nuvem PUBLICADA em ${new Date(cloudMeta.atualizadoEm||Date.now()).toLocaleString('pt-BR')} • total ${((cloudMeta.totalRegistros)||0).toLocaleString('pt-BR')} registros • ${cloudPartes} partes gravadas</p>
         <table><tr><th>entidade</th><th>partes</th><th>registros</th></tr>${ent}</table>
         <p class="${cloudModulosTotal?'ok':'warn'}" style="margin-top:6px">Tabelas sem mapeamento (vão p/ menu Migrados): <b>${cloudModulosTotal}</b> módulo(s)</p>`
      : `<p class="warn big b-warn">⚠️ Publicação NÃO confirmada (sem meta v2). Partes v2 soltas: ${cloudPartes}. Blob legado: ${cloudLegacy?'existe (backup antigo, incompleto)':'não existe'}.</p>`)
      + lacunasHtml
      + `<p class="dim" style="margin-top:4px">(Se acima mostrar erro de permissão/RLS, avise-nos.)</p>`;
  }catch(e){
    cloudErr = e.message||String(e);
    $('cloud').innerHTML = '<span class="bad big b-bad">❌ Erro consultando a nuvem: '+esc(cloudErr)+'</span><p class="dim">Isso pode indicar tabelas não criadas (rode o SQL) ou política RLS bloqueando a chave anon.</p>';
  }

  // ── VEREDITO ──
  let v = [];
  if(!cloudOk && cloudPartes>0) v.push('<span class="warn big b-warn">A nuvem tem um envio INCOMPLETO (a confirmação de publicação nunca foi gravada — provavelmente o último envio rodou uma versão antiga em cache).</span><div style="margin-top:6px">📋 <b>O que fazer:</b> 1) Abra o ERP pelo MESMO endereço/link que você usou na importação, aperte <b>Ctrl+Shift+R</b> e clique em <b>Gestão → Migração → Enviar para nuvem</b>; aguarde a mensagem <b>"PUBLICADO E VERIFICADO"</b>. 2) Depois abra o ERP pelo link oficial e clique em <b>Carregar da nuvem</b> — a build 3.9.7 recupera tudo, mesmo se algo faltar.</div>');
  if(!cloudOk && cloudPartes===0) v.push('<span class="bad big b-bad">A nuvem NÃO está acessível/publicada neste momento. Sem ela, nenhum PC novo recebe dados.</span>');
  if(cloudOk && localVazio) v.push('<span class="warn big b-warn">Solução: no ERP deste navegador, vá em <b>Gestão → Migração/nuvem → "Carregar da nuvem"</b>. Depois disso o menu 🧩 Migrados aparece (build ≥3.9.5).</span>');
  if(cloudOk && !localVazio && localModulos===0 && cloudModulosTotal>0) v.push('<span class="warn big b-warn">A nuvem TEM módulos migrados mas este navegador NÃO. Faça "Carregar da nuvem" de novo neste navegador (ou Ctrl+Shift+R e repita).</span>');
  if(cloudOk && localModulos>0) v.push('<span class="ok big b-ok">Tudo certo nos dados! Se o menu Migrados não aparece no ERP, o problema é a VERSÃO em cache. Abra o ERP pelo link com hash de commit e confira no F12 se a primeira linha do console diz "build 3.9.6".</span>');
  if(cloudOk && cloudModulosTotal===0 && localModulos===0 && cloudLacunas.length) v.push('<span class="bad big b-bad">⚠️ A nuvem foi publicada com uma base PEQUENA (parece demonstração), mas existem partes órfãs de um envio anterior — sinal de que os dados REAIS foram sobrescritos por engano.</span><div style="margin-top:6px">📋 <b>Como resolver:</b> 1) Neste link oficial, envie os JSONs do DBeaver de novo (C:\\Temp\\export) e clique <b>Importar TUDO</b>; 2) Clique <b>Enviar para nuvem</b> e aguarde "PUBLICADO E VERIFICADO"; 3) Aí sim, menu Migrados aparece e os outros PCs carregam da nuvem.</div>');
  else if(cloudOk && cloudModulosTotal===0 && localModulos===0) v.push('<span class="warn big b-warn">A nuvem não tem NENHUMA tabela sem mapeamento — todas as suas tabelas foram para os módulos oficiais (Clientes, Estoque, Vendas, Financeiro). Por isso o menu Migrados não existe para você: está correto, não está faltando nada.</span>');
  $('verdict').innerHTML = v.map(x=>`<div style="margin-bottom:8px">${x}</div>`).join('');

  console.log('DIAGNOSTICO_DIGICOPY', {localModulos, localModulosDetalhe, cloudOk, cloudPartes, cloudModulosTotal, cloudMeta});
})().catch(e=>{ $('verdict').innerHTML='<span class="bad big b-bad">Falha geral: '+esc(e.message)+'</span>'; });
</script>
</body>
</html>
