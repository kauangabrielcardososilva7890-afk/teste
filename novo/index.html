<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema Digicopy — núcleo novo (em construção)</title>
<style>
  :root{--azul:#0a1e8a;--azul-esc:#08166b;--claro:#eef1f8;--linha:#d8ddef;--texto:#111827;}
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--claro);color:var(--texto);display:flex;flex-direction:column;min-height:100vh}
  /* ── barra de cima: mesma linguagem do sistema de hoje ── */
  .app-titlebar{background:var(--azul);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
  .app-titlebar b{font-size:15px;letter-spacing:.2px}
  .app-titlebar small{display:block;opacity:.85;font-size:11px;margin-top:2px}
  .selo{background:#fbbf24;color:#3b2c00;font-weight:800;font-size:11px;padding:5px 10px;border-radius:999px;white-space:nowrap}
  .modern-topnav{background:#fff;border-bottom:1px solid var(--linha);padding:0 8px;display:flex;align-items:stretch;gap:2px;overflow:auto}
  .module{position:relative}
  .module>button{height:56px;min-width:104px;padding:6px 14px;background:transparent;border:0;border-right:1px solid #eef2f7;color:#334155;font-size:11.5px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;white-space:nowrap}
  .module>button i{font-size:19px;font-style:normal;color:var(--azul)}
  .module>button:hover,.module.ativo>button{background:#f1f6ff;color:var(--azul)}
  .module-menu{position:absolute;top:56px;left:0;min-width:240px;background:#fff;border:1px solid #dbe3ef;border-radius:12px;box-shadow:0 18px 45px rgba(15,23,42,.14);padding:8px;display:none;z-index:40}
  .module.aberto .module-menu{display:block}
  .module-menu button{width:100%;height:38px;border:0;background:transparent;border-radius:9px;display:flex;align-items:center;gap:10px;padding:0 10px;text-align:left;font-size:12.5px;color:#334155;cursor:pointer}
  .module-menu button:hover{background:#f1f6ff;color:var(--azul)}
  .module-menu button i{font-style:normal;font-size:16px;color:var(--azul)}
  .module-menu small{margin-left:auto;color:#94a3b8;font-size:10px}
  /* a tela aberta fica marcada no menu — o dono não se perde no meio de 32 telas */
  .module-menu button.ativa{background:#e8f0ff;color:var(--azul);font-weight:800}
  .module:has(button.ativa) > button{color:var(--azul);border-color:var(--azul)}
  /* ── área de trabalho ── */
  main{flex:1;padding:14px;max-width:1200px;width:100%;margin:0 auto}
  .cartao{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:14px;box-shadow:0 6px 22px rgba(10,30,138,.06)}
  .titulo-tela{font-size:16px;font-weight:900;color:var(--azul);margin:0 0 10px}
  .em-construcao{background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12;border-radius:12px;padding:14px;font-size:13px;line-height:1.5}
  .em-construcao b{color:#9a3412}
  .statusbar{height:24px;background:#f2f2f2;border-top:1px solid #cfd6df;font-size:11px;color:#111;display:flex;align-items:center;gap:14px;padding:0 10px;position:sticky;bottom:0}
  /* ── tabela/modal das telas novas (as mesmas classes que o teste usa) ── */
  .nfx-cabecalho{margin-bottom:10px}
  .nfx-abas{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .nfx-aba{border:1px solid var(--linha);background:#fff;color:var(--azul);font-weight:800;font-size:12.5px;padding:8px 14px;border-radius:10px;cursor:pointer}
  .nfx-aba-ativa{background:var(--azul);border-color:var(--azul);color:#fff}
  .nfx-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .nfx-bar input[type=search]{flex:1;min-width:180px;height:36px;border:1px solid var(--linha);border-radius:10px;padding:0 12px;font-size:13px}
  .nfx-btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--linha);font-weight:800;font-size:12.5px;cursor:pointer}
  .nfx-btn-forte{background:var(--azul);border-color:var(--azul);color:#fff}
  .nfx-btn-fraco{background:#fff;color:var(--azul)}
  .nfx-bar select{height:36px;border:1px solid var(--linha);border-radius:10px;padding:0 8px;font-size:12.5px;background:#fff;max-width:210px}
  /* a caixa de seleção inteligente (novo/selecao.js) — entra nas telas de venda/orçamento na fase 3 */
  .sfx-caixa{position:relative}
  .sfx-linha{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .sfx-linha select{height:36px;border:1px solid var(--linha);border-radius:10px;padding:0 8px;font-size:12.5px;background:#fff;max-width:200px}
  .sfx-linha input{flex:1;min-width:170px;height:36px;border:1px solid var(--linha);border-radius:10px;padding:0 12px;font-size:13px}
  .sfx-linha button{height:36px;width:42px;border:1px solid var(--linha);border-radius:10px;background:#fff;cursor:pointer}
  .sfx-resultados{position:absolute;z-index:40;left:0;right:0;top:calc(100% + 4px);max-height:260px;overflow:auto;background:#fff;border:1px solid var(--linha);border-radius:12px;box-shadow:0 12px 30px rgba(15,23,42,.12)}
  .sfx-escondido{display:none}
  .sfx-item{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:8px 12px;background:#fff;border:0;border-bottom:1px solid #eef1f8;cursor:pointer;font-size:13px}
  .sfx-item:hover,.sfx-item.sfx-ativo{background:#eef2ff}
  .sfx-titulo{font-weight:600;color:#0f172a}
  .sfx-detalhe{color:#64748b;font-size:12px;white-space:nowrap}
  .sfx-vazio{padding:10px 12px;color:#64748b;font-size:12.5px}
  /* a venda / notinha (novo/venda.js) */
  .vnd-topo{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;margin-bottom:10px}
  .vnd-bloco{flex:1;min-width:280px}
  .vnd-bloco-pequeno{max-width:280px}
  .vnd-rotulo{font-size:11.5px;text-transform:uppercase;color:#64748b;font-weight:700;margin-bottom:4px}
  .vnd-item{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;border:1px solid var(--linha);border-radius:12px;padding:10px;background:#fbfcff}
  .vnd-campo{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:#475569}
  .vnd-campo-prod{flex:1;min-width:260px}
  .vnd-campo-mini{width:110px}
  .vnd-campo input,.vnd-campo select,.vnd-topo select{height:36px;border:1px solid var(--linha);border-radius:10px;padding:0 10px;font-size:13px;background:#fff}
  .vnd-btn{height:36px;padding:0 14px;border:1px solid var(--linha);border-radius:10px;background:#fff;font-weight:700;cursor:pointer}
  .vnd-btn-forte{background:#0a1e8a;color:#fff;border-color:#0a1e8a}
  .vnd-btn-add{background:#0a1e8a;color:#fff;border-color:#0a1e8a}
  .vnd-erro{margin-top:8px;padding:8px 10px;border-radius:10px;background:#fee2e2;color:#b91c1c;font-size:12.5px}
  .vnd-aviso{margin-top:8px;padding:8px 10px;border-radius:10px;background:#dcfce7;color:#166534;font-size:12.5px}
  .vnd-tabela{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
  .vnd-tabela th{text-align:left;font-size:11.5px;text-transform:uppercase;color:#64748b;border-bottom:2px solid var(--linha);padding:8px}
  .vnd-tabela td{padding:8px;border-bottom:1px solid #eef1f8}
  .vnd-tag{font-size:10.5px;font-weight:800;background:rgba(10,30,138,.1);color:#0a1e8a;border-radius:999px;padding:2px 8px}
  .vnd-sub{color:#94a3b8;font-size:11.5px}
  .vnd-vazio{color:#94a3b8;text-align:center;padding:14px}
  .vnd-lixo{border:0;background:transparent;cursor:pointer;margin-left:6px}
  .vnd-rodape{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
  .vnd-totais{display:flex;gap:16px;align-items:center;font-size:13px;color:#334155;flex-wrap:wrap}
  .vnd-desc input{width:96px;height:32px;border:1px solid var(--linha);border-radius:8px;padding:0 8px;text-align:right}
  .vnd-total{font-weight:800;color:#0a1e8a;font-size:15px}
  .vnd-acoes{display:flex;gap:8px}
  .vnd-numero{margin-top:6px;font-size:12px;color:#334155}
  /* a janela do recebimento (novo/venda.js) */
  .vnd-fat-caixa{max-width:640px}
  .vnd-fat-topo{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--azul);color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:12px}
  .vnd-fat-topo .vnd-rotulo{color:rgba(255,255,255,.7)}
  .vnd-fat-dinheiro{text-align:right}
  .vnd-formas{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:6px 0 10px}
  .vnd-forma{height:42px;border:2px solid var(--linha);background:#fff;border-radius:11px;font-size:12.5px;font-weight:800;color:#334155;cursor:pointer}
  .vnd-forma-on{border-color:var(--azul);background:rgba(10,30,138,.06);color:var(--azul)}
  .vnd-forma-prazo{border-color:#d97706;background:#fffbeb;color:#b45309}
  .vnd-prazo{border:1px solid var(--linha);border-radius:12px;padding:10px;background:#f8f9ff}
  .vnd-parc-campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
  .vnd-parc-campos input{height:36px;border:1px solid var(--linha);border-radius:10px;padding:0 10px;font-size:13px;width:100%}
  .vnd-btn-fraco{background:#f8fafc;color:#334155}
  .vnd-tag-pagar{background:rgba(185,28,28,.1);color:#b91c1c}
  .vnd-os{margin-top:14px;border:1px solid var(--linha);border-radius:14px;padding:12px;background:#f8fafc}
  .vnd-os-topo{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:#0a1e8a;margin-bottom:8px}
  .vnd-os-linha{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:8px}
  .vnd-os-linha .vnd-campo{min-width:150px}
  .vnd-campo-largo{flex:1;min-width:220px}
  .vnd-os input,.vnd-os select{height:34px;border:1px solid var(--linha);border-radius:9px;padding:0 8px;font-size:12.5px;background:#fff}
  .vnd-dica{margin-top:6px;padding:8px 10px;border-radius:10px;font-size:12.5px}
  .vnd-dica-ok{background:#dcfce7;color:#166534}
  .vnd-dica-falta{background:#fef3c7;color:#92400e}
  .vnd-pix{margin:8px 0 10px}
  .px-painel{display:flex;gap:14px;align-items:center;border:1px solid #7dd3fc;background:#f0f9ff;border-radius:12px;padding:12px;flex-wrap:wrap}
  .px-qr{background:#fff;border:1px solid var(--linha);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px;align-items:center}
  .px-sem-net{font-size:10px;color:#94a3b8;max-width:150px;text-align:center}
  .px-lado{flex:1;min-width:240px}
  .px-titulo{margin:0;font-weight:800;color:#0c4a6e}
  .px-sub{margin:4px 0 0;font-size:12px;color:#475569}
  .px-copia{display:flex;gap:8px;margin-top:8px}
  .px-copia input{flex:1;min-width:0;height:34px;border:1px solid var(--linha);border-radius:9px;padding:0 8px;font-family:monospace;font-size:11px}
  .px-aviso{margin-top:8px;padding:8px 10px;border-radius:10px;background:#fef3c7;color:#92400e;font-size:12.5px}
  .px-aviso-manual{margin:8px 0 0;font-size:12px;color:#92400e}
  .fin-pill-estornado{background:rgba(120,53,15,.12);color:#78350f}
  .px-cfg{max-width:760px;border:1px solid var(--linha);border-radius:16px;padding:16px;background:#f8fafc}
  .px-cfg-titulo{margin:0 0 4px;font-size:14.5px;color:#0a1e8a}
  .px-cfg-sub{margin:0 0 12px;font-size:12px;color:#475569;line-height:1.45}
  .px-cfg-tipo{margin:4px 0 10px;font-size:11.5px;color:#64748b}
  .px-cfg-linha{display:flex;gap:10px;flex-wrap:wrap}
  .px-cfg-linha .vnd-campo{flex:1;min-width:200px}
  .px-cfg input{height:38px;border:1px solid var(--linha);border-radius:10px;padding:0 10px;font-size:13px;background:#fff}
  .px-cfg-botoes{display:flex;gap:8px;margin-top:12px}
  .px-cfg-preview{margin-top:12px;border:1px solid var(--linha);border-radius:12px;padding:12px;background:#fff;text-align:center}
  .px-cfg-nota{margin:8px 0 0;font-size:11px;color:#94a3b8}
  .px-cfg-codigo{width:100%;margin-top:6px;font-family:monospace;font-size:11px}
  .nfx-corpo{font-size:13px;color:#334155;line-height:1.5}
  /* o financeiro (novo/financeiro.js) */
  .fin-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .fin-sub{font-size:11.5px;color:#64748b;margin:4px 0}
  .fin-dupla{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .fin-dupla .vnd-campo{flex:1;min-width:150px}
  .fin-dupla select,.fin-dupla input{height:36px;border:1px solid var(--linha);border-radius:10px;padding:0 10px;font-size:13px;background:#fff}
  .fin-modos{display:flex;gap:8px;margin-bottom:8px}
  .fin-modo{height:32px;padding:0 14px;border:1px solid var(--linha);background:#fff;border-radius:9px;font-size:12px;font-weight:800;color:#475569;cursor:pointer}
  .fin-modo-on{background:var(--azul);border-color:var(--azul);color:#fff}
  .fin-filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .fin-filtros select,.fin-filtros input{height:34px;border:1px solid var(--linha);border-radius:10px;padding:0 10px;font-size:12.5px;background:#fff}
  .fin-filtros input[data-fin-termo]{min-width:220px;flex:1;max-width:380px}
  .fin-data{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:800;text-transform:uppercase;color:#64748b}
  .fin-data input{height:34px;border:1px solid var(--linha);border-radius:10px;padding:0 8px;font-size:12px}
  .fin-pendente{background:#f59e0b;border-color:#f59e0b;color:#fff;animation:pulsar 1.2s infinite}
  @keyframes pulsar{0%,100%{opacity:1}50%{opacity:.72}}
  .fin-erro{margin:6px 0;padding:8px 10px;border-radius:10px;background:#fee2e2;color:#b91c1c;font-size:12.5px}
  .fin-aviso{margin:6px 0;padding:8px 10px;border-radius:10px;background:#dcfce7;color:#166534;font-size:12.5px}
  .fin-pill{font-size:10.5px;font-weight:800;text-transform:uppercase;border-radius:999px;padding:2px 8px;background:#fef3c7;color:#92400e}
  .fin-pill-ok{background:#dcfce7;color:#166534}
  .fin-vermelho{color:#b91c1c}
  .fin-mais{text-align:center;margin-top:10px}
  .fin-chave{font-size:11px;text-transform:uppercase;color:#64748b;font-weight:800}
  .nfx-tabela{width:100%;border-collapse:collapse;font-size:13px}
  .nfx-tabela th{text-align:left;font-size:11.5px;text-transform:uppercase;color:#64748b;border-bottom:2px solid var(--linha);padding:8px}
  .nfx-tabela td{padding:9px 8px;border-bottom:1px solid #eef1f8}
  .nfx-acoes{text-align:right;white-space:nowrap}
  .nfx-mini{border:1px solid var(--linha);background:#fff;border-radius:9px;padding:6px 9px;font-size:12px;cursor:pointer}
  .nfx-perigo{color:#b91c1c;border-color:#fecaca}
  .nfx-vazio{color:#64748b;font-style:italic;padding:18px 8px}
  .nfx-rodape{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:11.5px;color:#475569;font-weight:700}
  .nfx-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
  .nfx-caixa{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .nfx-titulo{font-size:15px;font-weight:900;color:var(--azul);margin-bottom:10px}
  .nfx-campo{display:block;margin-bottom:10px}
  .nfx-campo span{display:block;font-size:11.5px;font-weight:800;color:#475569;margin-bottom:4px}
  .nfx-campo input{width:100%;height:36px;border:1px solid var(--linha);border-radius:10px;padding:0 12px;font-size:13px}
  .nfx-aviso{font-size:13px;margin:0 0 10px}
  .nfx-erro{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;font-size:12px;font-weight:700;padding:8px 10px;border-radius:10px;margin:8px 0}
  .nfx-botoes{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
  /* formulário de cadastro: duas colunas, campo largo ocupa a linha toda */
  .nfx-caixa-larga{max-width:780px;max-height:92vh;overflow:auto}
  .nfx-grade{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .nfx-campo-largo{grid-column:1 / -1}
  .nfx-campo select{width:100%;height:36px;border:1px solid var(--linha);border-radius:10px;padding:0 12px;font-size:13px;background:#fff}
  .nfx-vazio-inline{font-size:11px;color:#94a3b8}
  /* o aviso honesto da tela (o que ela faz e o que ainda não faz) */
  .nfx-nota{margin:0 0 10px;padding:8px 10px;border-radius:10px;background:#f8fafc;border:1px solid var(--linha);color:#475569;font-size:12px;line-height:1.5}
  #tela{overflow-x:auto}
  /* tela que ainda roda no sistema de hoje (diz o motivo, não finge) */
  .nfx-depende{background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;padding:16px;color:#7c2d12}
  .nfx-depende-titulo{font-size:15px;font-weight:900;color:#9a3412;margin-bottom:6px}
  .nfx-depende-sub{margin:0 0 8px;font-size:13px}
  .nfx-depende-motivo{margin:0;font-size:13px;line-height:1.55}
  .nfx-depende-pe{margin:10px 0 0;font-size:12px;color:#92400e}
</style>
</head>
<body>
  <div class="app-titlebar">
    <div>
      <b>Sistema Digicopy — núcleo novo</b>
      <small>Mesmo menu, mesmas telas de hoje. O coração (dados, numeração, fila da nuvem) é novo.</small>
    </div>
    <span class="selo">NÚCLEO NOVO — EM CONSTRUÇÃO</span>
  </div>

  <!-- O menu é montado no script, a partir da FICHA (novo/listas.js): assim nenhuma
       tela do sistema de hoje fica de fora sem alguém ver — e a tela que ainda roda no
       sistema antigo aparece marcada, com o motivo escrito. -->
  <nav class="modern-topnav" id="topnav"></nav>

  <main>
    <div class="cartao">
      <h2 class="titulo-tela" id="titulo-tela">Início</h2>
      <div id="tela"></div>
    </div>
  </main>

  <div class="statusbar">
    <span id="st-nucleo">coração: —</span>
    <span id="st-fila">fila da nuvem: 0</span>
    <span id="st-bd">as telas de hoje veem as mesmas listas</span>
  </div>

<script src="nucleo.js"></script>
<script src="ponte.js"></script>
<script src="selecao.js"></script>
<script src="pix.js"></script>
<script src="impressao.js"></script>
<script src="venda.js"></script>
<script src="financeiro.js"></script>
<script src="leituras.js"></script>
<script src="listas.js"></script>
<script src="telas.js"></script>
<script>
(function(){
  'use strict';
  var CHAVE = 'digicopy_novo_rascunho_v1';   // chave PRÓPRIA — não toca em nada do sistema de hoje
  // ?exemplo=1 — abre a tela com dados de EXEMPLO, só na MEMÓRIA, para ele ver a caixa de
  // seleção funcionando (campo "onde buscar", lupa, Enter) sem digitar nada. Neste modo o
  // rascunho do navegador NÃO é lido nem gravado: nada fica no PC dele.
  var EXEMPLO = /[?&]exemplo=1/.test(location.search);
  var nucleo = window.DIGICOPY_NUCLEO.criar({
    empresaId: 'rascunho',
    origem: 'este-pc',
    guardar: function () {
      if (!EXEMPLO) {
        try { localStorage.setItem(CHAVE, JSON.stringify(nucleo.paraJSON())); } catch (e) { /* sem espaço: segue sem rascunho */ }
      }
      pintarStatus();
    }
  });
  try {
    var salvo = localStorage.getItem(CHAVE);
    if (salvo && !EXEMPLO) nucleo.carregarDeJSON(JSON.parse(salvo));
  } catch (e) { /* rascunho ilegível: começa vazio */ }

  // A MESMA PONTE que vai entrar no sistema de hoje: aqui ela está ligada a um `db`
  // de rascunho, só para mostrar que as telas continuam mexendo em listas comuns.
  // As listas e os SCHEMAS saem da FICHA (novo/listas.js). Antes eram cinco listas escritas
  // à mão aqui — e o schema de `contasReceber` existia em duas versões no núcleo novo
  // (a da venda e a do financeiro): quem montasse por último ganhava. Agora é uma verdade.
  var FICHA = window.DIGICOPY_LISTAS;
  var banco = {};
  var schemas = {};
  if (FICHA) {
    Object.keys(FICHA.LISTAS).forEach(function (n) { banco[n] = []; schemas[n] = FICHA.LISTAS[n].schema; });
    Object.keys(FICHA.ESQUEMAS).forEach(function (n) { if (!banco[n]) banco[n] = []; schemas[n] = FICHA.ESQUEMAS[n]; });
  } else {
    banco = { clientes: [], produtos: [], vendas: [], contasReceber: [], contasPagar: [] };
    schemas = {
      clientes: { nome: { obrigatorio: true, tipo: 'texto' }, telefone: { tipo: 'texto' }, cidade: { tipo: 'texto' } },
      produtos: { nome: { obrigatorio: true, tipo: 'texto' }, preco: { tipo: 'numero' }, categoria: { tipo: 'texto' }, estoque: { tipo: 'numero' }, estoqueInfinito: { tipo: 'boleano' }, sku: { tipo: 'texto' } },
      vendas: { numero: { tipo: 'texto' }, clienteId: { tipo: 'texto' }, itens: { tipo: 'lista' }, desconto: { tipo: 'numero' }, total: { tipo: 'numero' }, status: { tipo: 'texto' } },
      contasReceber: { origem: { tipo: 'texto' }, vendaId: { tipo: 'texto' }, valor: { tipo: 'numero' }, status: { tipo: 'texto' } },
      contasPagar: { fornecedor: { tipo: 'texto' }, descricao: { tipo: 'texto' }, valor: { tipo: 'numero' }, status: { tipo: 'texto' } }
    };
  }
  var ponte = window.DIGICOPY_PONTE.ligar({ db: banco, nucleo: nucleo, origem: 'este-pc', schemas: schemas });
  ponte.primeiraVarredura();
  window.__ponte = ponte; window.__nucleoNovo = nucleo; window.__dbNovo = banco;

  // ═══════════════════════════════════════════════════════════════════════
  // O MENU E AS TELAS — tudo saído da FICHA (novo/listas.js)
  // ───────────────────────────────────────────────────────────────────────
  var CAT = window.DIGICOPY_LISTAS;                    // a ficha de todas as telas
  var TELAS_CAT = (CAT && CAT.TELAS) || [];
  var ICONES_GRUPO = { inicio: '🏠', cadastros: '👥', atendimento: '🧾', locacao: '🖨️',
    fiscal: '🧮', financeiro: '💰', escola: '🎓', config: '⚙️' };
  var ICONES = { inicio: '🏠', clientes: '👤', produtos: '📦', recargas: '🖨️', vendas: '🛒',
    orcamentos: '📋', os: '🔧', impressoras: '🖨️', contratos: '📄', parque: '🏢', leituras: '📈',
    contasReceber: '📥', contasPagar: '📤', 'fiscal-nfe': '📑', 'fiscal-catalogo': '📚',
    'fiscal-cert': '🔐', 'fiscal-historico': '🗂️', escola: '🔎', usuarios: '👥', tecnicos: '🧑‍🔧',
    empresas: '🏭', auditoria: '🧭', pix: '💠', nuvem: '☁️', relatorios: '📊',
    'painel-gerente': '🧑‍💼', navegador: '🌐', migrados: '🗃️' };

  function esc(t){
    return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function telaDaFicha(id){
    for (var i = 0; i < TELAS_CAT.length; i++) if (TELAS_CAT[i].id === id) return TELAS_CAT[i];
    return null;
  }

  var titulos = {};                                    // o título de cada tela (vem da ficha)
  TELAS_CAT.forEach(function (t) { titulos[t.id] = t.rotulo; });
  titulos.inicio = 'Início';
  titulos.pix = 'Configurações — Pix';
  titulos.nuvem = 'Nuvem e backups';

  // O MENU: um botão por MENU do sistema de hoje e, dentro dele, TODAS as telas daquela
  // área. Tela que ainda roda no sistema antigo aparece marcada — e diz o motivo quando abre.
  function montarMenu(){
    var nav = document.getElementById('topnav');
    if (!nav || !CAT) return;
    nav.innerHTML = CAT.GRUPOS.map(function (g) {
      var itens = TELAS_CAT.filter(function (t) { return t.grupo === g.id; });
      if (!itens.length) return '';
      return '<div class="module" data-modulo="' + esc(g.id) + '">' +
        '<button type="button" data-menu="' + esc(g.id) + '"><i>' + (ICONES_GRUPO[g.id] || '•') + '</i>' + esc(g.rotulo) + '</button>' +
        '<div class="module-menu">' + itens.map(function (t) {
          var marca = t.marca ? '<small>' + esc(t.marca) + '</small>' : '';
          return '<button type="button" data-tela="' + esc(t.id) + '"><i>' + (ICONES[t.id] || '•') + '</i>' +
                 esc(t.rotulo) + marca + '</button>';
        }).join('') + '</div></div>';
    }).join('');
  }

  // aviso na tela (nunca alert/confirm/prompt): escreve no rodapé e some sozinho
  function lfbAviso(txt, deuCerto){
    var st = document.getElementById('st-bd');
    if (!st) return;
    var antes = st.getAttribute('data-antes') || st.textContent;
    st.setAttribute('data-antes', antes);
    st.textContent = (deuCerto === false ? '⚠️ ' : '✅ ') + txt;
    st.style.color = deuCerto === false ? '#b91c1c' : '#166534';
    clearTimeout(window.__pixAvisoTimer);
    window.__pixAvisoTimer = setTimeout(function(){
      st.textContent = antes; st.style.color = '';
    }, 6000);
  }
  function pintarStatus(){
    document.getElementById('st-nucleo').textContent = 'coração: v' + nucleo.versao + ' (núcleo)';
    document.getElementById('st-fila').textContent = 'fila da nuvem: ' + (nucleo.mudancas().length || 0);
  }

  var vendaTela = null;      // a janela da venda (novo/venda.js)
  var pixTela = null;        // o cartão do Pix (novo/pix.js)
  var finTelas = {};         // as telas do financeiro (novo/financeiro.js)

  // As telas de cadastro são UMA peça por MENU (as abas são as listas daquele menu) —
  // por isso a página guarda uma instância por área, e não uma por tela.
  var telasPorGrupo = {};
  function telaDeLista(t){
    var area = telasPorGrupo[t.grupo];
    if (!area) {
      area = telasPorGrupo[t.grupo] = window.DIGICOPY_TELAS.criarTelas({
        nucleo: nucleo, elemento: document.getElementById('tela'), documento: document,
        grupo: t.grupo, lista: t.lista
      });
    } else {
      area.estado.lista = t.lista;
      area.estado.busca = '';
      area.estado.mostrando = 'vivos';
      area.desenhar();
    }
    return area;
  }

  function abrir(tela){
    // nenhuma janela pode ficar pendurada quando ele troca de tela
    if (vendaTela && vendaTela.fecharRecebimento) vendaTela.fecharRecebimento();
    Object.keys(finTelas).forEach(function(k){ if (finTelas[k] && finTelas[k].fecharJanela) finTelas[k].fecharJanela(); });
    document.querySelectorAll('.module').forEach(function(m){ m.classList.remove('aberto'); });
    var alvo = document.getElementById('tela');
    var ficha = telaDaFicha(tela);
    document.getElementById('titulo-tela').textContent = titulos[tela] || (ficha && ficha.rotulo) || 'Em construção';
    // marca a tela aberta no menu (mesmo quando ela abre pela barra de dentro)
    document.querySelectorAll('[data-tela]').forEach(function(b){ b.classList.toggle('ativa', b.getAttribute('data-tela') === tela); });

    // 1) tela de cadastro (clientes, produtos, contratos, chamados, leituras…) — uma
    //    peça só atende todas; a ficha diz os campos e as abas
    if (ficha && ficha.tipo === 'lista') {
      telaDeLista(ficha);
      pintarStatus();
      return;
    }

    // 2) tela própria do núcleo novo (já migrada e provada por teste)
    if (tela === 'inicio') {
      var prontas = TELAS_CAT.filter(function (t) { return t.tipo === 'lista' || t.tipo === 'feita'; }).length;
      var faltam = TELAS_CAT.length - prontas;
      alvo.innerHTML = '<div class="em-construcao">O coração novo (lápide, versão, numeração, fila da nuvem) já atende ' +
        '<b>' + prontas + ' telas</b> do sistema de hoje: cadastros (clientes, produtos, recargas, máquinas, contratos, ' +
        'máquinas nos clientes, leituras, chamados, orçamentos, usuários, técnicos, empresas, auditoria e catálogo fiscal), ' +
        'a <b>venda/notinha</b> (recebimento, impressão, OS e Pix) e o <b>financeiro</b>. ' +
        (faltam ? 'As <b>' + faltam + '</b> que faltam abrem dizendo exatamente do que dependem (nota fiscal, Buscador Escola, ' +
          'relatórios, painel do gerente, navegador e nuvem — nenhuma some do menu).' : '') +
        ' Nada aqui toca o sistema atual nem a nuvem.</div>';
      pintarStatus();
      return;
    }
    if (tela === 'vendas') {
      if (!vendaTela) {
        vendaTela = window.DIGICOPY_VENDA.criarVenda({
          nucleo: nucleo, elemento: alvo, empresaId: 'rascunho', documento: document, aoMudar: pintarStatus,
          empresa: { nome: 'DIGICOPY', fantasia: 'DIGICOPY' }, usuarioNome: 'Atendente'
        });
      } else {
        vendaTela.desenhar();
      }
      pintarStatus();
      return;
    }
    if (tela === 'contasReceber' || tela === 'contasPagar') {
      var tipo = tela === 'contasReceber' ? 'Receber' : 'Pagar';
      if (!finTelas[tela]) {
        finTelas[tela] = window.DIGICOPY_FINANCEIRO.criarFinanceiro({
          nucleo: nucleo, elemento: alvo, empresaId: 'rascunho', documento: document,
          tipo: tipo, aoMudar: pintarStatus
        });
      } else {
        finTelas[tela].desenhar();
      }
      pintarStatus();
      return;
    }
    if (tela === 'pix') {
      if (!pixTela) {
        pixTela = window.DIGICOPY_PIX.montarConfig({
          nucleo: nucleo, elemento: alvo,
          aoAvisar: function (txt, deuCerto) { pintarStatus(); lfbAviso ? lfbAviso(txt, deuCerto) : null; }
        });
      } else {
        pixTela.desenhar();
      }
      pintarStatus();
      return;
    }

    // 3) tela que ainda roda no sistema de hoje: abre EXPLICANDO por quê (nunca em branco)
    var pendente = ficha || { rotulo: 'Em construção', motivo: 'Esta tela ainda não foi migrada; ela continua no sistema de hoje.' };
    alvo.innerHTML = window.DIGICOPY_TELAS.htmlDependencia(pendente);
    pintarStatus();
  }

  montarMenu();   // o menu inteiro sai da ficha (nenhuma tela do sistema fica de fora)

  document.querySelectorAll('[data-menu]').forEach(function(b){
    b.addEventListener('click', function(ev){
      ev.stopPropagation();
      var mod = b.closest('.module');
      var jaAberto = mod.classList.contains('aberto');
      document.querySelectorAll('.module').forEach(function(m){ m.classList.remove('aberto'); });
      if (!jaAberto) mod.classList.add('aberto');
    });
  });
  document.addEventListener('click', function(){
    document.querySelectorAll('.module').forEach(function(m){ m.classList.remove('aberto'); });
  });
  document.querySelectorAll('[data-tela]').forEach(function(b){
    b.addEventListener('click', function(ev){ ev.stopPropagation(); abrir(b.getAttribute('data-tela')); });
  });
  // a troca de aba dentro das telas também atualiza o título (é o mesmo conteúdo,
  // outra lista) — o ouvinte fica no cartão, que não é recriado a cada desenho
  document.getElementById('tela').addEventListener('click', function(ev){
    var aba = ev.target && ev.target.closest ? ev.target.closest('.nfx-aba') : null;
    if(!aba) return;
    var l = aba.getAttribute('data-aba');
    if(titulos[l]) document.getElementById('titulo-tela').textContent = titulos[l];
  });

  // dados de exemplo (só no modo ?exemplo=1): entram sem sujar a fila da nuvem
  var FIN = window.DIGICOPY_FINANCEIRO ? window.DIGICOPY_FINANCEIRO.regras : null;
  var novoReceber = FIN ? FIN.novoReceber : function () { return null; };
  var novaDespesa = FIN ? FIN.novaDespesa : function () { return null; };
  if (EXEMPLO) {
    [
      { id: 'ex-cli-1', nome: 'José Ávila', telefone: '(38) 99999-1234', cidade: 'Montes Claros' },
      { id: 'ex-cli-2', nome: 'Loja 480 Papelaria', telefone: '(11) 3232-4800', cidade: 'São Paulo' },
      { id: 'ex-cli-3', nome: 'MARIA JOSE', telefone: '(38) 3232-1010', cidade: 'montes claros' },
      { id: 'ex-cli-4', nome: 'Recarga Express', telefone: '(31) 98888-7777', cidade: 'Belo Horizonte' }
    ].forEach(function (c) { nucleo.salvar('clientes', c, { semFila: true }); });
    // preço e estoque entram como NÚMERO: o coração recusa texto onde é para ser número
    // (era o defeito do modo exemplo — os 4 produtos não chegavam a ser gravados)
    [
      { id: 'ex-prod-1', nome: 'Cartucho HP 664 Preto', sku: 'HP664', preco: 89.9, categoria: 'Cartucho', estoque: 5 },
      { id: 'ex-prod-2', nome: 'Toner Samsung MLT-D111S', sku: 'SS101', preco: 150, categoria: 'Insumo', estoque: 2 },
      { id: 'ex-prod-3', nome: 'Serviço de instalação', preco: 80, categoria: 'Serviço' },
      { id: 'ex-prod-4', nome: 'Recarga de toner 85A', preco: 40, categoria: 'Recarga' }
    ].forEach(function (p) { nucleo.salvar('produtos', p, { semFila: true }); });
    // dois títulos a receber e um a pagar, para o Financeiro ter o que mostrar no exemplo
    function emDias(dias){ var x = new Date(); x.setDate(x.getDate() + dias); return x.toISOString().slice(0,10); }
    [
      novoReceber({ descricao: 'Mensalidade de locação', valor: 250, clienteId: 'ex-cli-1', clienteNome: 'José Ávila', vencimento: emDias(15) }),
      novoReceber({ descricao: 'Recarga de toner 85A', valor: 40, clienteId: 'ex-cli-4', clienteNome: 'Recarga Express', vencimento: emDias(-5) })
    ].forEach(function (c) { nucleo.salvar('contasReceber', c, { semFila: true }); });
    nucleo.salvar('contasPagar', novaDespesa({ fornecedor: 'Distribuidora ABC', descricao: 'Compra de cartuchos', categoria: 'Suprimentos', valor: 320, vencimento: emDias(7) }, 'rascunho'), { semFila: true });
    // se algum exemplo não entrar (data errada no código), avisa na barra em vez de ficar quieto
    var entraram = nucleo.contar('clientes') + nucleo.contar('produtos') + nucleo.contar('contasReceber') + nucleo.contar('contasPagar');
    if (entraram !== 11) document.getElementById('st-nucleo').textContent = 'exemplo incompleto: ' + entraram + ' de 11';
    pintarStatus();
  }

  abrir('clientes');
  pintarStatus();
})();
</script>
</body>
</html>
