<!DOCTYPE html>
<!-- Página PÚBLICA do orçamento — NÃO é pagamento Pix.
     Token (?c=) consulta o worker. Dados (?d=) só se o worker não estiver no ar.
     Depois de autorizar ou recusar o link não vale mais. -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Orçamento — DIGICOPY</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#eef1f8;color:#111;min-height:100vh;padding:16px}
.card{background:#fff;border-radius:20px;box-shadow:0 12px 40px rgba(10,30,138,.14);max-width:560px;margin:12px auto;overflow:hidden}
.topo{background:#0a1e8a;color:#fff;padding:18px 22px}
.topo h1{font-size:18px}
.topo p{font-size:11.5px;opacity:.8;margin-top:4px}
.corpo{padding:20px 22px}
.meta{font-size:13px;color:#444;margin:0 0 14px;line-height:1.5}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;text-transform:uppercase;color:#64748b;padding:8px 6px;border-bottom:2px solid #e2e8f0}
td{padding:8px 6px;border-bottom:1px solid #f1f5f9}
.tot{text-align:right;font-size:20px;font-weight:800;color:#0a1e8a;margin:14px 0}
.btns{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
button{flex:1;min-width:140px;height:48px;border:0;border-radius:12px;font-weight:800;font-size:14.5px;cursor:pointer}
.ok{background:#15803d;color:#fff}
.no{background:#fff;color:#b91c1c;border:1.5px solid #fecaca}
.aviso{margin-top:16px;padding:12px;border:1.5px solid #0a1e8a;background:#eef2ff;border-radius:12px;font-size:12px;line-height:1.45;color:#0a1e8a;white-space:pre-wrap}
.erro,.msg{padding:28px 8px;text-align:center;font-size:15px;line-height:1.5}
.erro{color:#a33}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.ask{background:#fff;border-radius:16px;max-width:360px;width:100%;padding:20px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.ask p{font-size:16px;font-weight:800;text-align:center;margin-bottom:14px}
.ask .row{display:flex;gap:8px}
</style>
</head>
<body>
<div class="card">
  <div class="topo">
    <h1>Aprovar orçamento</h1>
    <p>Isto não é pagamento. Escolha autorizar ou recusar.</p>
  </div>
  <div class="corpo" id="area">Carregando…</div>
</div>
<script>
(function(){
  var API='https://digicopy-sync-api.kauangabrielcardososilva7890.workers.dev';
  var AVISO='Prezados clientes,\n\nInformamos que as manutenções em impressoras EPSON exigem um prazo maior para a conclusão. Para estes equipamentos, utilizamos produtos químicos específicos que demandam um tempo necessário de reação para garantir a eficácia do serviço. Por isso, solicitamos um prazo médio de 15 dias úteis para a entrega da manutenção.\n\nVale ressaltar que o equipamento pode ficar pronto antes deste prazo, a depender da agilidade da reação dos produtos utilizados.\n\nAgradecemos a compreensão de todos e nos colocamos à disposição para eventuais dúvidas!';
  var area=document.getElementById('area');
  var params=new URLSearchParams(location.search);
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function money(v){ return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
  function soTel(v){ return String(v||'').replace(/\D/g,''); }
  function decod(raw){
    if(!raw) return null;
    try{
      var b=String(raw).replace(/-/g,'+').replace(/_/g,'/');
      while(b.length%4) b+='=';
      return JSON.parse(decodeURIComponent(escape(atob(b))));
    }catch(e){ return null; }
  }
  function chaveUsado(tok){ return 'digicopy_orc_usado_'+String(tok||''); }
  function marcarUsado(tok){ if(!tok) return; try{ localStorage.setItem(chaveUsado(tok),'1'); }catch(e){} }
  function jaUsado(tok){ if(!tok) return false; try{ return localStorage.getItem(chaveUsado(tok))==='1'; }catch(e){ return false; } }
  function telaUsado(){ area.innerHTML='<p class="erro">Este link não vale mais. Peça o orçamento atualizado para a loja.</p>'; }
  function whats(tel, texto){
    var n=soTel(tel);
    var url='https://wa.me/'+(n||'')+'?text='+encodeURIComponent(texto);
    location.href=url;
  }
  function jaDecidido(j){
    if(!j) return false;
    if(j.error==='USED' || j.error==='ALREADY_DECIDED' || j.error==='ALREADY_APPROVED') return true;
    var st=String(j.status||'');
    return st==='aprovado' || st==='recusado';
  }
  function confirmar(msg, cb){
    var mask=document.createElement('div');
    mask.className='mask';
    mask.innerHTML='<div class="ask"><p>'+esc(msg)+'</p><div class="row"><button class="no" id="ask-no">Não</button><button class="ok" id="ask-ok">Sim</button></div></div>';
    document.body.appendChild(mask);
    document.getElementById('ask-no').onclick=function(){ mask.remove(); };
    document.getElementById('ask-ok').onclick=function(){ mask.remove(); cb(); };
  }
  function tela(d){
    var itens=(d.it||d.itens||[]).map(function(it){
      return '<tr><td>'+esc(it.d||it.descricao||'')+'</td><td>'+esc(it.q||it.qtd||'')+'</td><td>'+money(it.p||it.preco)+'</td><td><b>'+money(it.s||it.subtotal)+'</b></td></tr>';
    }).join('');
    area.innerHTML='<p class="meta"><b>Orçamento '+esc(d.n||d.numero||'')+'</b><br>Cliente: '+esc(d.c||d.clienteNome||'')+'<br>Emissão: '+esc(d.dt||d.data||'')+'</p>'
      +'<table><thead><tr><th>Descrição</th><th>Qtd</th><th>Unit.</th><th>Total</th></tr></thead><tbody>'+itens+'</tbody></table>'
      +'<div class="tot">'+money(d.tot||d.total)+'</div>'
      +'<div class="btns"><button class="ok" id="btn-ok">Autorizar</button><button class="no" id="btn-no">Recusar</button></div>'
      +'<div class="aviso">'+esc(d.aviso||AVISO)+'</div>';
    document.getElementById('btn-ok').onclick=function(){ confirmar('Tem certeza?', function(){ decidir('aprovar', d); }); };
    document.getElementById('btn-no').onclick=function(){ confirmar('Tem certeza?', function(){ decidir('recusar', d); }); };
  }
  function decidir(acao, d){
    var nome=d.c||d.clienteNome||'cliente';
    var cod=d.n||d.numero||'';
    var tel=d.w||d.whatsapp||'';
    var tok=d.t||d.token||params.get('c')||'';
    var msgOk='Olá, sou '+nome+'. Foi autorizado o orçamento do COD '+cod+'. Por favor, vá atualizando para mim sobre o andamento.';
    var msgNo='Olá, sou '+nome+'. O orçamento do COD '+cod+' NÃO foi autorizado. Por favor, entre em contato para alinharmos as opções.';
    var msg=acao==='aprovar'?msgOk:msgNo;
    area.innerHTML='<p class="msg">'+(acao==='aprovar'?'Orçamento autorizado. Abrindo o WhatsApp da loja…':'Orçamento recusado. Abrindo o WhatsApp da loja para avisar…')+'</p>';
    marcarUsado(tok);
    try{
      if(typeof BroadcastChannel!=='undefined'){
        var bc=new BroadcastChannel('digicopy_orcamentos');
        bc.postMessage({ acao:acao, token:tok, numero:cod, clienteNome:nome, time:Date.now() });
      }
      localStorage.setItem('digicopy_orc_decisao_'+tok, JSON.stringify({ acao:acao, numero:cod, clienteNome:nome, time:Date.now() }));
    }catch(e){}

    var corpo={c:tok, acao:acao, numero:cod, clienteNome:nome, mensagem:msg, d:params.get('d')||''};
    fetch(API+'/orcamento',{method:'POST',headers:{\'content-type\':\'application/json\'},body:JSON.stringify(corpo)})
      .then(function(r){ return r.json().then(function(j){ return {okHttp:r.ok, j:j}; }); })
      .then(function(res){
        if(res && res.j && jaDecidido(res.j) && !res.okHttp){ telaUsado(); return; }
        setTimeout(function(){ whats(tel, msg); }, 400);
      })
      .catch(function(){
        setTimeout(function(){ whats(tel, msg); }, 400);
      });
  }
  var d=decod(params.get('d'));
  var token=params.get('c')||(d&&(d.t||d.token))||'';
  if(token && jaUsado(token)){ telaUsado(); return; }
  if(token){
    fetch(API+'/orcamento?c='+encodeURIComponent(token))
      .then(function(r){ return r.json().then(function(j){ return {okHttp:r.ok, j:j}; }); })
      .then(function(res){
        var j=res&&res.j;
        if(j && (j.error==='USED' || j.error==='ALREADY_DECIDED' || j.status==='aprovado' || j.status==='recusado')){
          marcarUsado(token);
          telaUsado();
          return;
        }
        if(j && j.ok){ tela(Object.assign({}, d||{}, j, {t:token, n:j.numero|| (d&&d.n), c:j.clienteNome||(d&&d.c), w:j.whatsapp||(d&&d.w)})); return; }
        if(d && (d.n||d.numero)){ tela(d); return; }
        area.innerHTML='<p class="erro">Orçamento não encontrado. Peça o link atualizado para a loja.</p>';
      })
      .catch(function(){
        if(d && (d.n||d.numero)) tela(d);
        else area.innerHTML='<p class="erro">Não foi possível abrir este orçamento. Peça o link atualizado para a loja.</p>';
      });
    return;
  }
  if(d && (d.n||d.numero)){ tela(d); return; }
  area.innerHTML='<p class="erro">Link de orçamento inválido. Peça o orçamento atualizado para a loja.</p>';
})();
</script>
</body>
</html>
