# Espelho executavel de ferramentas/teste-visual-navegador.yml (o original traz o
# cartaz de instrucoes). Se mudar la, republice aqui.
name: Teste visual no navegador (celular 390x844)

# ─────────────────────────────────────────────────────────────────────────────
# Por que isto roda aqui e não no sandbox do agente: o ambiente dele só tem
# saída para npm/PyPI/GitHub — não consegue abrir o site publicado nem instalar
# um Chromium (CDN bloqueado, bibliotecas de sistema ausentes). O runner do
# GitHub Actions tem internet inteira, abre https://teste-60f.pages.dev num
# Chromium de verdade, mede o layout das 14 telas em 390x844 (e confere que o
# desktop de 1365x850 não mudou) e publica o resultado como issue — que o agente
# lê pela API. Nada de credencial aqui: a base de teste é sintética, montada
# pelo próprio script dentro da página (ver ferramentas/teste_visual.js).
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - 'arena/01a0d9c3-teste'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  telas:
    name: abrir o site publicado e medir o corte
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # O navegador: mesmo Playwright do teste do dono, instalado de npm (o
      # --with-deps traz as bibliotecas de sistema que o Chromium exige).
      - name: playwright + chromium
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium

      # O Pages publica a partir deste mesmo commit; sem esta espera o teste
      # mediria a versão anterior e o veredito seria mentira. A comparação é pelo
      # CARIMBO DO BUNDLE (app.bundle.js?v=<versao>-<hash>), não só pela versão:
      # duas rodadas na mesma versão mudando só o bundle passaríam no teste velho
      # e o veredito seria do bundle de antes.
      - name: espera o Pages publicar este exato bundle
        run: |
          alvo="${{ vars.URL_TESTE }}"
          [ -z "$alvo" ] && alvo="https://teste-60f.pages.dev/importar.html"
          aqui=$(node -p "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');(h.match(/app\.bundle\.js\?v=[0-9.]+-[a-f0-9]+/)||['?'])[0]")
          echo "bundle deste commit: $aqui"
          for i in $(seq 1 24); do
            la=$(curl -fsSL -m 25 "$alvo" 2>/dev/null | grep -o 'app\.bundle\.js?v=[0-9.]*-[a-f0-9]*' | head -1 || true)
            echo "tentativa $i no ar: ${la:-nada}"
            [ -n "$la" ] && [ "$la" = "$aqui" ] && break
            sleep 20
          done
          if [ "$la" != "$aqui" ]; then echo "::error::o Pages ainda serve outro bundle ($la != $aqui) — o teste abaixo mediria o deploy anterior"; exit 1; fi

      - name: medir as telas no celular e no desktop
        id: mede
        run: |
          versao=$(node -p "require('./package.json').version")
          url="${{ vars.URL_TESTE }}"
          [ -z "$url" ] && url="https://teste-60f.pages.dev/index.html"
          if node ferramentas/teste_visual.js --url "$url" --versao "v${versao}"; then
            echo "ok=0" >> "$GITHUB_ENV"
          else
            echo "ok=1" >> "$GITHUB_ENV"
          fi

      # O canal de volta para o agente: os números chegam como corpo de issue
      # (a API do GitHub é alcançável dos dois lados; artefato, não).
      - name: publicar o resultado como issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          simbolo=$([ "$ok" = "0" ] && echo "✅" || echo "❌")
          curto="${GITHUB_SHA:0:7}"
          corpo="resultado.md"
          [ -f "$corpo" ] || printf '## ❌ Teste visual não chegou a medir\n\nO script falhou antes de escrever o resultado — ver o log do job.\n' > "$corpo"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$simbolo Teste visual #${GITHUB_RUN_NUMBER} (${curto})" \
            --body-file "$corpo" || true

      - name: guardar os prints para o dono ver
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prints-teste-visual-${{ github.run_number }}
          path: |
            resultado.json
            resultado.md
            *.png
          if-no-files-found: ignore

      - name: fechar o job com o veredito
        run: exit "$ok"
